<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>UTDT FIGHT</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage-wrap">
    <canvas id="stage"></canvas>
    <p id="hint">Drag to move</p>
  </main>

  <section id="menu" hidden>
    <div class="menu-bg" aria-hidden="true"></div>
    <div class="menu-shade" aria-hidden="true"></div>
    <div class="menu-content">
      <h1 class="menu-title">UTDT FIGHT</h1>
      <button id="play" class="play-btn" type="button">Play</button>
    </div>
  </section>

  <div id="flash" aria-hidden="true"></div>

  <audio id="music" src="assets/music.mp3" loop preload="auto"></audio>

  <div id="lock" hidden>
    <div class="lock-inner">
      <div class="phone" aria-hidden="true"></div>
      <p class="lock-title">Rotate your phone</p>
      <p class="lock-sub">Turn your phone to landscape to continue</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
